# Настройки инструментов разработки. Зависимости проекта — в requirements.txt.
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/W — стиль (PEP 8), F — реальные ошибки (неиспользуемые импорты, неопределённые имена),
# I — порядок импортов, B — частые баги (изменяемые аргументы по умолчанию и т.п.)
select = ["E", "W", "F", "I", "B"]
